[project]
name = "paper-router"
version = "0.1.0"
description = "Aggregate paper metadata from multiple academic providers with routing, filtering, and rate limits."
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1,<0.29.0",
    "mcp (>=1.27.0,<2.0.0)",
]

[project.scripts]
paper-router = "paper_router.cli:main"
paper-router-mcp = "paper_router.mcp_server:main"

[tool.poetry]
packages = [{include = "paper_router", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-asyncio = "^0.26.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
